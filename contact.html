<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="צור קשר לקבלת הצעת מחיר ופרטים נוספים על מערכות סולאריות">
  <meta name="keywords" content="צור קשר, הצעת מחיר, מערכות סולאריות, התקנה">
  <title>צור קשר | RNRG — רוני חג׳ג׳ הנדסת חשמל</title>
  <link rel="canonical" href="https://rnrg.co.il/contact.html">
  <link rel="stylesheet" href="assets/css/style-modern.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="container">
      <a href="solar.html" class="logo">
        <img src="assets/img/solar solution logos/rnrg.png" alt="לוגו החברה" class="logo-icon">
      </a>
      <nav>
        <ul>
          <li><a href="solar.html">בית</a></li>
          <li><a href="about.html">על החברה</a></li>
          <li><a href="solutions.html">פתרונות סולאריים</a></li>
          <li><a href="projects.html">פרויקטים</a></li>
          <li><a href="contact.html">צור קשר</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <section class="contact">
      <h1>צור קשר</h1>
      <!-- הסר את action והשתמש ב-JS כדי לשלוח דרך EmailJS -->
      <form id="contactForm">
        <label for="name">שם מלא:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">אימייל:</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">פלאפון:</label>
        <input type="tel" id="phone" name="phone" inputmode="tel" autocomplete="tel" pattern="[0-9\-+ ]{9,15}" placeholder="050-1234567" required>

        <label for="message">הודעה:</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit" class="btn">שלח הודעה</button>
      </form>
      <div class="contact-logos">
        <a href="tel:+972546656076">
          <img src="assets/img/phone-logo.png" alt="טלפון" class="logo-icon-">
        </a>
        <a href="https://wa.me/972546656076" target="_blank">
          <img src="assets/img/whatsapp-logo.png" alt="וואצאפ" class="logo-icon-">
        </a>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p> 
           כל הזכויות שמורות - חברת <span class="RNRG">RNRG</span>   
      </p>
      <p id="year"></p>
    </div>
  </footer>

  <script type="text/javascript"
  src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
</script>

  <!-- 3) סקריפט הראשי שלך -->
  <script src="assets/js/analytics.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
