name: Build & Deploy site + React (/energy) to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # בונים את ה-React שנמצא בתיקיית app-react
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app-react/package-lock.json
      - name: Install deps (React app)
        working-directory: app-react
        run: npm ci
      - name: Build (React app)
        working-directory: app-react
        run: npm run build

      # מכינים תיקיית פרסום נקייה (_site) מהשורש + מעתיקים אליה את ה-build ל-/r
      - name: Prepare publish folder
        run: |
          mkdir -p _site
          # מעתיקים את האתר הסטטי הקיים (השורש) ל-_site, בלי קבצי פיתוח
          rsync -av \
            --exclude 'app-react' \
            --exclude '.git*' \
            --exclude 'node_modules' \
            --exclude '.github' \
            --exclude 'README*' \
            ./ _site/

          # מכניסים את תוצר ה-React לנתיב /energy בתוך _site
          mkdir -p _site/energy
          cp -r app-react/build/* _site/energy/

          # Fallback ל-SPA אם בעתיד תוסיף react-router
          cp _site/r/index.html _site/energy/404.html || true

          # אם יש לך דומיין מותאם - בטל הערה בשורה הבאה והחלף לכתובת שלך
           echo "https://rnrg.co.il/" > _site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
