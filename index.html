<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>בחירת שירות — חשמל / סולארי</title>
  <meta name="description" content="דף נחיתה מינימליסטי לבחירת עמוד חשמל או עמוד סולארי" />
  <!-- Heebo: clean Hebrew typeface -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#0b1020; --bg2:#0e152f;
      --text:#e5e7eb; --muted:#a6b3c6; --border:rgba(255,255,255,.12);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:"Heebo",system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Noto Sans",sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 75% 10%, rgba(96,165,250,.18), transparent 60%),
        radial-gradient(1200px 700px at 25% 90%, rgba(34,211,238,.18), transparent 60%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
      background-size:200% 200%;
      animation:bgShift 14s ease-in-out infinite;
      display:grid; place-items:center; padding:2rem;
    }
    @keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

    .container{width:min(1100px,100%); text-align:center}
    .title{font-weight:800; letter-spacing:-.02em; font-size:clamp(1.6rem,2.2vw + 1rem,2.4rem)}
    .subtitle{margin:.5rem 0 2rem; color:var(--muted)}

    .grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(1rem,3vw,2rem); align-items:stretch}

    a.card{position:relative; text-decoration:none; color:inherit; border:1px solid var(--border);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      backdrop-filter:blur(8px); border-radius:24px; padding-block:clamp(2rem,5vw,3rem);
      display:grid; place-items:center; gap:1rem; box-shadow:0 10px 30px rgba(0,0,0,.18);
      transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    }
    a.card:hover{transform:translateY(-4px) scale(1.01); box-shadow:0 16px 40px rgba(0,0,0,.28); border-color:rgba(255,255,255,.22)}
    a.card:focus-visible{outline:2px solid #93c5fd; outline-offset:4px}

    /* Logo frame */
    .logoWrap{width:clamp(110px,24vw,180px); aspect-ratio:1; border-radius:32px; display:grid; place-items:center; position:relative;
      background:radial-gradient(120px 120px at 50% 30%, rgba(255,255,255,.15), rgba(255,255,255,.06));
      border:1px solid var(--border); overflow:hidden;
    }
    .logoWrap::after{content:""; position:absolute; inset:-1px; border-radius:inherit; padding:1px;
      background:linear-gradient(135deg, rgba(96,165,250,.6), rgba(34,211,238,.6));
      -webkit-mask:linear-gradient(#0000,#0000),linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude;
    }
    /* Variant accents */
    .card[data-variant="electric"] .logoWrap::after{background:linear-gradient(135deg,#60a5fa,#22d3ee)}
    .card[data-variant="solar"] .logoWrap::after{background:linear-gradient(135deg,#fbbf24,#f59e0b)}

    .icon{width:54%; height:54%; display:block}
    .label{font-weight:700; font-size:clamp(1rem,1.2vw + .6rem,1.25rem); letter-spacing:.02em}

    /* Footer */
    .footer{margin-top:2rem; color:var(--muted); font-size:.9rem}

    @media (max-width: 720px){ .grid{grid-template-columns:1fr} }
    @media (prefers-reduced-motion: reduce){ body{animation:none} a.card:hover{transform:none} }
  </style>
</head>
<body>
  <main class="container">
    <h1 class="title"></h1>
    <p class="subtitle"></p>

    <section class="grid" aria-label="קישורים מהירים לעמודי השירות">
      <!-- Electric page card -->
      <a class="card" data-variant="electric" href="/energy/" aria-label="מעבר לעמוד החשמל" title="מעבר לעמוד החשמל">
        <div class="logoWrap" aria-hidden="true">
          <!-- Image logo instead of SVG -->
          <img src="assets/img/electric/logo.png" alt="לוגו חשמל" class="logo-icon" style="width:54%; height:auto; display:block" loading="lazy" decoding="async">
        </div>
        <div class="label">לעמוד החשמל</div>
      </a>

      <!-- Solar page card -->
      <a class="card" data-variant="solar" href="solar.html" aria-label="מעבר לעמוד הסולארי" title="מעבר לעמוד הסולארי">
        <div class="logoWrap" aria-hidden="true">
          <!-- Image logo instead of SVG -->
          <img src="assets/img/solar solution logos/rnrg.png" alt="לוגו החברה" class="logo-icon" style="width:54%; height:auto; display:block" loading="lazy" decoding="async">
        </div>
        <div class="label">לעמוד הסולארי</div>
      </a>
    </section>

    <div class="footer" aria-hidden="true">
    </div>
  </main>

  <!-- No JavaScript needed; CSS handles animations & hover. -->
</body>
</html>
