<svg width="400" height="150" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF8C00"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
  </defs>
  <!-- Sun -->
  <circle cx="300" cy="30" r="20" fill="#FFD700"/>
  <!-- Sun rays -->
  <g stroke="#FFD700" stroke-width="4">
    <line x1="300" y1="5" x2="300" y2="0"/>
    <line x1="300" y1="55" x2="300" y2="60"/>
    <line x1="275" y1="30" x2="250" y2="30"/>
    <line x1="325" y1="30" x2="350" y2="30"/>
    <line x1="280" y1="15" x2="265" y2="5"/>
    <line x1="320" y1="15" x2="335" y2="5"/>
    <line x1="280" y1="45" x2="265" y2="55"/>
    <line x1="320" y1="45" x2="335" y2="55"/>
  </g>
  <!-- Wave -->
  <path d="M50,100 C100,50 200,150 300,100" stroke="#FFD700" stroke-width="8" fill="none"/>
  <!-- Text -->
  <text x="0" y="130" font-family="Arial, sans-serif" font-size="100" font-weight="bold" fill="url(#grad)">RNRG</text>
