<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <title>בדיקת התאמה</title>
  <!-- Link to your CSS if needed -->
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header>
    <div class="container">
      <a href="index.html" class="logo">לוגו החברה</a>
      <nav>
        <ul>
          <li><a href="index.html">בית</a></li>
          <li><a href="about.html">על החברה</a></li>
          <li><a href="solutions.html">פתרונות סולאריים</a></li>

          <li><a href="contact.html">צור קשר</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
        <section class="contact">
            <h1>בדיקת התאמה</h1>
            <form id="compatibilityForm">
                <label for="name">שם מלא:</label>
                <input type="text" id="name" name="name" required>
          
                <label for="email">אימייל:</label>
                <input type="email" id="email" name="email" required>
          
                <label for="phone">פלאפון:</label>
                <input type="number" id="phone" name="phone" required>
                <label for="hasPermit">האם יש היתר בנייה?</label>
                <select id="hasPermit" name="hasPermit" required>
                    <option value="yes">כן</option>
                    <option value="no">לא</option>
                    <option value="unknown">לא יודע</option>
                </select>

                <label for="propertyType">סוג נכס:</label>
                <select id="propertyType" name="propertyType" required>
                    <option value="private">בית פרטי</option>
                    <option value="business">עסקי</option>
                </select>

                <label for="message">הודעה:</label>
               <textarea id="message" name="message"></textarea>


                <label for="fullAddress">כתובת מלאה:</label>
                <input type="text" id="fullAddress" name="fullAddress" placeholder="הקלד כתובת..." required />

                <!-- Add more fields for your compatibility check if needed -->
                <label for="roofArea">שטח פנוי (מ"ר):</label>
                <input type="number" id="roofArea" name="roofArea" required />

                <button type="submit">לבדיקה</button>
            </form>


            <div class="contact-logos">
                <a href="tel:+972546656076">
                  <img src="assets/img/phone-logo.png" alt="טלפון" class="logo-icon">
                </a>
                <a href="https://wa.me/972546656076" target="_blank">
                  <img src="assets/img/whatsapp-logo.png" alt="וואצאפ" class="logo-icon">
                </a>
              </div>
        </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 כל הזכויות שמורות - חברת מערכות סולאריות</p>
    </div>
  </footer>

  <!-- Google Maps Places API (optional) -->

  src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
</script>

  <!-- Main JS with both forms logic -->
  <script src="assets/js/main.js"></script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBCDR-EHFlWhJ-740m5xeD3ElSdpmyF2mM&libraries=places&language=he&callback=initAutocomplete"
    async
    defer
  >
</script>

</body>
</html>
